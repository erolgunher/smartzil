name: Komut Guncelle

on:
  workflow_dispatch:
    inputs:
      cihaz:
        description: 'Hedef Cihaz'
        required: true
        default: 'nazim'
      komut:
        description: 'Gönderilen Komut'
        required: true
        default: 'durum'

jobs:
  guncelle:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Actions'ın repoya commit atabilmesi için yazma izni
    steps:
      - name: Repo Klonla
        uses: actions/checkout@v4

      - name: Komut Dosyasini Olustur/Guncelle
        run: |
          echo '{
            "cihaz": "${{ github.event.inputs.cihaz }}",
            "komut": "${{ github.event.inputs.komut }}",
            "zaman": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",
            "id": "'$(date +%s%N)'"
          }' > komut.json

      - name: Degisiklikleri Git ile Kaydet ve Gonder
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add komut.json
          git commit -m "Otomatik Komut: ${{ github.event.inputs.komut }} -> ${{ github.event.inputs.cihaz }}"
          git push
